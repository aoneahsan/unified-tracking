<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="unified-tracking logo">
  <title>unified-tracking</title>
  <defs>
    <linearGradient id="ut-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6" />
      <stop offset="1" stop-color="#7b3fe4" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#ut-bg)" />

  <!-- Many provider streams converging into one unified call -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.92">
    <path d="M30 34 C 58 34, 58 64, 86 64" />
    <path d="M30 64 H 86" />
    <path d="M30 94 C 58 94, 58 64, 86 64" />
  </g>

  <circle cx="30" cy="34" r="8" fill="#ffffff" opacity="0.92" />
  <circle cx="30" cy="64" r="8" fill="#ffffff" opacity="0.92" />
  <circle cx="30" cy="94" r="8" fill="#ffffff" opacity="0.92" />
  <circle cx="92" cy="64" r="12" fill="#ffffff" />
</svg>
